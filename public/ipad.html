<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>M Stand 店长</title><link rel="manifest" href="/ipad.webmanifest"><meta name="theme-color" content="#fff7f2">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="M Stand店长"><link rel="apple-touch-icon" href="/icon-180.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:-apple-system,"Hiragino Sans","PingFang SC",sans-serif;background:#fff7f2;color:#3d2a20;padding:env(safe-area-inset-top) 16px 84px;font-size:16px}
button{font-family:inherit;cursor:pointer}
.hd{display:flex;align-items:center;gap:12px;height:56px}
.hd h1{font-size:20px;margin:0;color:#ff5c8a;font-weight:900}
.sum{margin-left:auto;display:flex;gap:8px}
.sum div{background:#fff;border-radius:14px;padding:6px 12px;font-size:13px;color:#8a6d60;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.sum b{display:block;font-size:18px;color:#3d2a20}
.dot{width:10px;height:10px;border-radius:5px;background:#ccc}
.al{display:none;align-items:center;gap:10px;border-radius:14px;padding:10px 14px;margin-bottom:10px;font-weight:800;color:#fff}
.al.on{display:flex}.al span{-webkit-box-flex:1;flex:1}.al a{background:#fff;color:#3d2a20;text-decoration:none;padding:8px 12px;border-radius:10px;font-size:14px}
.al.red{background:#ef4b4b}.al.org{background:#ff9a2e}
.home{display:-webkit-box;display:flex;gap:14px;align-items:flex-start}
.col{display:flex;flex-direction:column;gap:14px}.c1{width:46%}.c2{-webkit-box-flex:1;flex:1;min-width:0}
.card{background:#fff;border-radius:22px;padding:16px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.ct{font-size:14px;font-weight:800;color:#a08070;margin:0 0 10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sb{border:3px solid #f1e4dc;background:#fff;border-radius:18px;height:76px;font-size:19px;font-weight:900;color:#5a4035}
.sb small{display:block;font-size:12px;font-weight:700;color:#a08070}
.sb.on{border-color:transparent;color:#fff}.sb.on small{color:rgba(255,255,255,.85)}
.sb[data-m=open].on{background:#2fb36b}.sb[data-m=prep].on{background:#ff8a3d}.sb[data-m=shop].on{background:#7a6cf0}.sb[data-m=closed].on{background:#555}
.cd{display:none;margin-top:12px;align-items:center;gap:10px;background:#fff3ea;border-radius:16px;padding:10px 12px}
.cd.on{display:flex}.cd .t{-webkit-box-flex:1;flex:1;font-size:30px;font-weight:900;color:#e2552b}.cd .t small{display:block;font-size:12px;color:#a08070;font-weight:700}
.sm{border:0;border-radius:12px;height:48px;min-width:58px;font-size:16px;font-weight:900;background:#ffe0cc;color:#c4561f;padding:0 10px}
.us{font-size:13px;font-weight:700;margin-top:8px;color:#8a6d60}
.qn{display:flex;align-items:center;gap:12px}
.num{width:150px;height:120px;border-radius:20px;background:linear-gradient(135deg,#ff8a3d,#ff5c8a);color:#fff;display:flex;align-items:center;justify-content:center;font-size:64px;font-weight:900}
.qb{-webkit-box-flex:1;flex:1;display:flex;flex-direction:column;gap:10px}
.big{border:0;border-radius:18px;height:70px;font-size:24px;font-weight:900;color:#fff;background:#ff5c8a}
.big.b2{background:#ffa64d;height:52px;font-size:20px}
.row{display:flex;gap:10px;margin-top:10px}.row>*{-webkit-box-flex:1;flex:1}
.ghost{border:2px solid #f1e4dc;background:#fff;border-radius:14px;height:48px;font-size:16px;font-weight:800;color:#8a6d60}
.srch{display:flex;gap:8px;margin-bottom:10px}
.srch input{-webkit-box-flex:1;flex:1;font-size:18px;height:50px;border-radius:14px;border:2px solid #f1e4dc;padding:0 14px;-webkit-appearance:none}
.chips{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;margin-bottom:10px}
.chip{flex:none;border:2px solid #f1e4dc;background:#fff;border-radius:20px;height:40px;padding:0 14px;font-size:15px;font-weight:800;color:#8a6d60}
.chip.on{background:#3d2a20;border-color:#3d2a20;color:#fff}
.list{max-height:calc(100vh - 290px);overflow-y:auto;-webkit-overflow-scrolling:touch}
.it{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid #f6ece6}
.it img{width:56px;height:56px;border-radius:12px;object-fit:cover;background:#ffe9dc;flex:none}
.it .nm{-webkit-box-flex:1;flex:1;min-width:0}.it .nm b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-block;font-size:12px;font-weight:900;border-radius:8px;padding:2px 8px;margin-top:3px}
.tag.ok{background:#e3f7ea;color:#239457}.tag.part{background:#fff0d9;color:#c57700}.tag.all{background:#ef4b4b;color:#fff}
.it.all img{-webkit-filter:grayscale(1);filter:grayscale(1);opacity:.5}
.tg{border:0;border-radius:14px;height:52px;min-width:104px;font-size:16px;font-weight:900;color:#fff;background:#ef4b4b}.tg.re{background:#2fb36b}
.ex{border:0;background:none;font-size:22px;color:#b9a296;width:40px;height:52px}
.vs{display:flex;flex-wrap:wrap;gap:8px;padding:0 4px 12px 72px}
.vs button{border:2px solid #bfe8cd;background:#f2fbf5;color:#239457;border-radius:12px;height:48px;min-width:100px;font-size:15px;font-weight:800}
.vs button.so{border-color:#f5b5b5;background:#fdeeee;color:#d33;text-decoration:line-through}
.more{display:none}.more.on{display:block}.home.off{display:none}
.mg{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f6ece6}.kv b{font-size:18px}
.bar{height:14px;background:#ffe9dc;border-radius:7px;overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;background:#ff5c8a}
.pr{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f6ece6}.pr b{font-size:24px;color:#e2552b;min-width:56px}.pr .nm{-webkit-box-flex:1;flex:1;font-size:14px}
.vip{display:block;color:#d6336c;font-size:12px;margin-top:2px}
input.tx,select{font-size:17px;height:48px;border-radius:12px;border:2px solid #f1e4dc;padding:0 12px;background:#fff;width:100%;-webkit-appearance:none}
table{width:100%;border-collapse:collapse;font-size:15px}td{padding:8px 4px;border-bottom:1px solid #f6ece6}td input{width:64px;height:40px;font-size:16px;border:2px solid #f1e4dc;border-radius:10px;text-align:center}
tr.low td{color:#d33;font-weight:800}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:10px;background:#fff;padding:8px 16px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -2px 10px rgba(0,0,0,.05);z-index:50}
.nav button{-webkit-box-flex:1;flex:1;border:0;background:#fff;height:52px;border-radius:14px;font-size:17px;font-weight:900;color:#a08070}.nav button.on{background:#ffe9dc;color:#ff5c8a}
.ov{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:200}
.dlg{background:#fff;border-radius:24px;padding:24px;width:420px;max-width:90%;text-align:center}.dlg h3{margin:0 0 8px;font-size:22px}.dlg p{color:#8a6d60;margin:0 0 16px}
.lock{position:fixed;top:0;left:0;right:0;bottom:0;background:#fff7f2;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:300}
.lock input{font-size:30px;height:64px;width:280px;text-align:center;border-radius:16px;border:2px solid #f1e4dc}
#toast{display:none;position:fixed;left:50%;top:16px;-webkit-transform:translateX(-50%);transform:translateX(-50%);z-index:400;color:#fff;font-weight:800;font-size:18px;padding:14px 22px;border-radius:16px;box-shadow:0 4px 16px rgba(0,0,0,.25)}
@media (orientation:portrait){.home{display:block}.c1{width:auto;margin-bottom:14px}.list{max-height:none}.mg{grid-template-columns:1fr}}
</style></head><body>
<div class="lock" id="lock"><h2 style="color:#ff5c8a">M Stand 店长</h2><input id="pin" type="password" inputmode="numeric" maxlength="8" placeholder="PIN"><button class="big" style="width:280px;margin-top:14px" onclick="login()">进入</button><div id="msg" style="color:#d33;margin-top:10px"></div></div>
<div id="toast"></div>
<div class="hd"><h1>M Stand 店长</h1><div class="dot" id="conn"></div>
 <div class="sum" onclick="nav('more')"><div>今日<b id="tRev">-</b></div><div>本月还差<b id="mGap">-</b></div></div></div>
<div class="al red" id="aPeak"><span id="aPeakT"></span><a href="https://merchants.ubereats.com/manager/" target="_blank">暂停 Uber ↗</a></div>
<div class="al red" id="aUber"><span id="aUberT"></span><a href="https://merchants.ubereats.com/manager/" target="_blank">Uber Manager ↗</a></div>
<div class="al org" id="aClosed"><span>还是「营业结束」— 开店了吗？</span><a href="#" onclick="askShop('open');return false">切回营业中</a></div>
<div class="al org" id="aLow"><span id="aLowT"></span><a href="#" onclick="nav('more');return false">备料</a></div>

<div class="home" id="home">
 <div class="col c1">
  <div class="card"><div class="ct" style="display:flex;align-items:center">店铺状态<span style="margin-left:auto;font-weight:700">等待时长 <select id="shopM" style="width:96px;height:36px;font-size:15px;display:inline-block"><option value="20">20分</option><option value="30">30分</option><option value="40" selected>40分</option><option value="60">60分</option></select></span></div>
   <div class="g2">
    <button class="sb" data-m="open" onclick="askShop('open')">营业中<small>営業中</small></button>
    <button class="sb" data-m="prep" onclick="askShop('prep')">准备中<small>準備中</small></button>
    <button class="sb" data-m="shop" onclick="askShop('shop')">采购中<small>買い出し中</small></button>
    <button class="sb" data-m="closed" onclick="askShop('closed')">营业结束<small>営業終了</small></button>
   </div>
   <div class="cd" id="cd"><div class="t"><span id="cdT">--:--</span><small id="cdE"></small></div><button class="sm" onclick="adjShop(-5)">−5</button><button class="sm" onclick="adjShop(5)">+5</button><button class="sm" style="background:#2fb36b;color:#fff" onclick="askShop('open')">结束</button></div>
   <div class="us" id="uSt"></div>
  </div>
  <div class="card"><div class="ct">叫号</div>
   <div class="qn"><div class="num" id="n">-</div><div class="qb"><button class="big" onclick="act('next')">下一位 ▶</button><button class="big b2" onclick="act('recall')">重叫</button></div></div>
   <div class="row"><button class="ghost" onclick="act('skip')">跳号</button><button class="ghost" onclick="nav('more')">制作中 <b id="nOpen">0</b></button></div>
  </div>
 </div>
 <div class="col c2"><div class="card"><div class="ct">售罄</div>
  <div class="srch"><input id="q" placeholder="搜索饮品" oninput="drawMenu()"><button class="ghost" style="width:120px;flex:none" onclick="restoreAll()">全部恢复</button></div>
  <div class="chips" id="chips"></div><div class="list" id="items"></div></div></div>
</div>

<div class="more" id="more"><div class="mg">
 <div class="card"><div class="ct">销售</div>
  <div class="kv"><span>今日杯数</span><b id="sCups">-</b></div><div class="kv"><span>今日店内</span><b id="sRev">-</b></div><div class="kv"><span>今日 Uber</span><b id="uRev">-</b></div>
  <div class="kv"><span>本月合计</span><b id="mTot">-</b></div><div class="bar"><i id="mBar" style="width:0"></i></div>
  <div class="kv"><span>还差 / 每天需</span><b id="mPer">-</b></div><div class="us" id="uNote"></div></div>
 <div class="card"><div class="ct">制作中（💗熟客）</div><div id="prep"></div></div>
 <div class="card"><div class="ct">横屏公告 · 音量</div>
  <input class="tx" id="ann" maxlength="60" placeholder="例：今日芒果售罄 / 本日マンゴー売り切れ">
  <div class="row"><select id="annM"><option value="60">1小时</option><option value="180">3小时</option><option value="720">到打烊</option></select><button class="big b2" onclick="setAnn()">发布</button><button class="ghost" onclick="clearAnn()">撤下</button></div>
  <div class="us" id="annNow"></div>
  <div class="row" style="align-items:center"><span style="flex:none;font-weight:800">音量 <span id="volV"></span></span><input id="vol" type="range" min="0" max="100" step="10" style="height:40px" onchange="setVol(this.value)"></div></div>
 <div class="card"><div class="ct">备料（开店库存 − 今日用量）</div><table id="stk"></table>
  <div class="row"><button class="big b2" onclick="saveStock()">保存</button><button class="ghost" onclick="askDo('今日重新开始？','从现在开始重新计算用量','确定','#ff9a2e',function(){stockPost({restock:true})})">重新开始</button></div>
  </div>
</div></div>

<div class="nav"><button class="on" id="nHome" onclick="nav('home')">首页</button><button id="nMore" onclick="nav('more')">更多</button></div>
<div class="ov" id="ov"><div class="dlg"><h3 id="dT"></h3><p id="dS"></p><div class="row"><button class="ghost" onclick="$('ov').style.display='none'">取消</button><button class="big" id="dOk" style="height:52px;font-size:20px">确定</button></div></div></div>
<script>
var PIN=localStorage.pin||'',ST={},CUST={},MENU=[],OPEN={},CAT='',OV=null,CLK=0;
function $(i){return document.getElementById(i)}
function yen(n){return n==null?'-':'¥'+Math.round(n).toLocaleString()}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return '&#'+c.charCodeAt(0)+';'})}
function toast(t,bad){var e=$('toast');e.textContent=t;e.style.background=bad?'#ef4b4b':'#2fb36b';e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(function(){e.style.display='none'},bad?6000:2500)}
function api(p,b){return fetch('/api/ipad/'+p,{method:b?'POST':'GET',headers:{'Content-Type':'application/json','x-pin':PIN},body:b?JSON.stringify(b):undefined}).then(function(r){if(r.status===403){$('lock').style.display='flex';toast('PIN 错误或已更改',true);throw 0}return r.json()})}
function post(b){b.pin=PIN;return fetch('/api/action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}).then(function(r){return r.json()})}
function login(){PIN=$('pin').value;api('overview').then(function(){localStorage.pin=PIN;$('lock').style.display='none';boot()}).catch(function(){$('msg').textContent='PIN 错误'})}
function nav(t){$('home').className='home'+(t==='home'?'':' off');$('more').className='more'+(t==='more'?' on':'');$('nHome').className=t==='home'?'on':'';$('nMore').className=t==='more'?'on':'';if(t==='more'){loadStock();loadSales()}}
function askDo(t,s,ok,col,fn){$('dT').textContent=t;$('dS').innerHTML=s;$('dOk').textContent=ok;$('dOk').style.background=col;$('ov').style.display='flex';$('dOk').onclick=function(){$('dOk').onclick=null;$('ov').style.display='none';fn()}}
var SHN={open:'营业中',prep:'准备中',shop:'采购中',closed:'营业结束'};
function askShop(m){var mins=+$('shopM').value;askDo('切换为「'+SHN[m]+'」？',m==='open'?'横屏恢复菜单 · Uber 恢复接单':(m==='closed'?'横屏显示营业结束':'横屏显示等待 '+mins+' 分钟')+' · Uber 暂停接单',
 '确定',m==='open'?'#2fb36b':'#ff5c8a',function(){api('screen',{shop:m,mins:mins}).then(loadOv)})}
function adjShop(d){api('screen',{shopAdj:d}).then(loadOv)}
function act(a){post({action:a})}
function setVol(v){$('volV').textContent=v+'%';api('screen',{vol:v/100}).then(loadOv)}
function setAnn(){var t=$('ann').value.replace(/^\s+|\s+$/g,'');if(!t)return;api('screen',{ann:t,mins:$('annM').value}).then(function(){toast('已发布到横屏');loadOv()})}
function clearAnn(){api('screen',{ann:''}).then(loadOv)}
function loadSales(){api('sales').then(function(s){var t=s.today||{cups:0,rev:0,orders:0},u=s.uber||{};
 $('tRev').textContent=yen(t.rev+(u.today?u.today.rev:0));$('mGap').textContent=s.gap?yen(s.gap):'达成 🎉';
 $('sCups').textContent=t.cups+' 杯 · '+t.orders+' 单';$('sRev').textContent=yen(t.rev);$('uRev').textContent=u.today?yen(u.today.rev):'—';
 $('mTot').textContent=yen(s.total)+' / '+yen(s.target);$('mBar').style.width=Math.min(100,s.total/s.target*100)+'%';$('mPer').textContent=yen(s.gap)+' / '+yen(s.perDay);
 $('uNote').textContent=u.src==='none'?'Uber 本月数据未接入，只算店内':'';if(s.err)$('uNote').textContent+=' Square: '+s.err}).catch(function(){})}
function loadOv(){api('overview').then(function(o){OV=o;CLK=o.now?o.now-new Date().getTime():CLK;
 var sh=o.screen.shop,m=sh?sh.mode:'open',b=document.querySelectorAll('.sb'),i;for(i=0;i<b.length;i++)b[i].className='sb'+(b[i].getAttribute('data-m')===m?' on':'');
 $('cd').className='cd'+(sh&&sh.until?' on':'');tickCd();
 var U=o.chan.uber,bad=U.state==='fail'||U.state==='offline';$('uSt').textContent='Uber：'+U.text;$('uSt').style.color=bad?'#d33':U.state==='pending'?'#c57700':'#239457';
 $('aUber').className='al red'+(bad&&sh?' on':'');$('aUberT').textContent='Uber 没有同步：'+U.text;
 $('aPeak').className='al red'+(o.peak?' on':'');$('aPeakT').textContent='高峰：'+o.open+' 单在做';
 $('aLow').className='al org'+(o.stockLow.length?' on':'');$('aLowT').textContent='快用完：'+o.stockLow.join('、');
 $('aClosed').className='al org'+(o.closedStale?' on':'');
 var v=Math.round((o.screen.vol==null?1:o.screen.vol)*100);$('vol').value=v;$('volV').textContent=v+'%';
 var a=o.screen.ann;$('annNow').textContent=a&&a.until>Date.now()?'正在显示：'+a.text:''}).catch(function(){})}
function hm(t){var d=new Date(t+9*3600e3);return ('0'+d.getUTCHours()).slice(-2)+':'+('0'+d.getUTCMinutes()).slice(-2)}
function tickCd(){var sh=OV&&OV.screen.shop;if(!sh||!sh.until)return;var ms=Math.max(0,sh.until-(new Date().getTime()+CLK)),s=Math.ceil(ms/1000);
 $('cdT').textContent=('0'+Math.floor(s/60)).slice(-2)+':'+('0'+s%60).slice(-2);$('cdE').textContent='预计 '+hm(sh.until)+' 自动恢复营业';if(!ms)setTimeout(loadOv,2500)}
function custTag(x){var c=CUST[x.order];if(!c||c.none||!c.visits)return '';return '<span class="vip">💗 '+(c.name?esc(c.name)+' · ':'')+'第'+c.visits+'次 · '+c.top.map(function(t){return esc(t.n)}).join('、')+'</span>'}
function render(s){ST=s;$('n').textContent=(s.current||s.current===0)?s.current:'-';var p=s.preparing||[];$('nOpen').textContent=p.length;
 $('prep').innerHTML=p.map(function(x){if(x.order&&!(x.order in CUST)&&!/^web/.test(x.id)){CUST[x.order]=null;api('customer?order='+encodeURIComponent(x.order)).then(function(c){CUST[x.order]=c;render(ST)}).catch(function(){})}
  return '<div class="pr"><b>'+esc(x.num)+'</b><div class="nm">'+esc(x.items||'')+custTag(x)+'</div><button class="sm" onclick="post({action:\'callid\',id:\''+esc(x.id)+'\'})">叫号</button><button class="sm" style="background:#eee;color:#888" onclick="post({action:\'done\',id:\''+esc(x.id)+'\'})">✕</button></div>'}).join('')||'<div class="us">没有订单</div>'}
function soN(i){var n=0;for(var k=0;k<i.vars.length;k++)if(i.vars[k].so)n++;return n}
function loadMenu(){api('menu').then(function(m){MENU=m;drawMenu()}).catch(function(){})}
function drawMenu(){var cs=['全部','有售罄'],seen={},i;for(i=0;i<MENU.length;i++)if(!seen[MENU[i].cat]){seen[MENU[i].cat]=1;cs.push(MENU[i].cat)}
 $('chips').innerHTML=cs.map(function(c){var k=c==='全部'?'':c;return '<button class="chip'+(CAT===k?' on':'')+'" onclick="CAT=\''+esc(k)+'\';drawMenu()">'+esc(c)+'</button>'}).join('');
 var q=$('q').value.replace(/^\s+|\s+$/g,'').toLowerCase();
 $('items').innerHTML=MENU.map(function(it,ix){var n=soN(it),t=it.vars.length;if(q&&it.name.toLowerCase().indexOf(q)<0)return '';if(CAT==='有售罄'&&!n)return '';if(CAT&&CAT!=='有售罄'&&it.cat!==CAT)return '';
  var all=n===t,tag=n===0?'<span class="tag ok">在售</span>':all?'<span class="tag all">售罄</span>':'<span class="tag part">部分售罄 '+n+'/'+t+'</span>';
  return '<div class="it'+(all?' all':'')+'"><img src="'+esc(it.img)+'"><div class="nm"><b>'+esc(it.name)+'</b>'+tag+'</div>'+(t>1?'<button class="ex" onclick="OPEN['+ix+']=!OPEN['+ix+'];drawMenu()">'+(OPEN[ix]?'▴':'▾')+'</button>':'')+
  '<button class="tg'+(all?' re':'')+'" onclick="askSold('+ix+','+(!all)+')">'+(all?'恢复':'售罄')+'</button></div>'+
  (OPEN[ix]?'<div class="vs">'+it.vars.map(function(v,vi){return '<button class="'+(v.so?'so':'')+'" onclick="askVar('+ix+','+vi+')">'+esc(v.name)+'</button>'}).join('')+'</div>':'')}).join('')||'<div class="us">没有符合的饮品</div>'}
function doSold(it,b){toast('正在更新…');return api('soldout',b).then(function(r){if(r.error){toast('失败：'+r.error,true);return}
 for(var k=0;k<it.vars.length;k++)if(!b.vars||b.vars.indexOf(it.vars[k].id)>=0)it.vars[k].so=b.sold;drawMenu();toast((b.sold?'已售罄 ':'已恢复 ')+it.name);setTimeout(loadMenu,4000)}).catch(function(e){toast(e===0?'PIN 错误':'网络错误，请重试',true)})}
function askSold(ix,to){var it=MENU[ix];askDo(to?'售罄？':'恢复？','<b>'+esc(it.name)+'</b>'+(it.vars.length>1?'（全部 '+it.vars.length+' 个规格）':''),to?'售罄':'恢复',to?'#ef4b4b':'#2fb36b',function(){doSold(it,{id:it.id,sold:to,confirm:true})})}
function askVar(ix,vi){var it=MENU[ix],v=it.vars[vi],to=!v.so;askDo(to?'这个规格售罄？':'这个规格恢复？','<b>'+esc(it.name)+'</b><br>'+esc(v.name),to?'售罄':'恢复',to?'#ef4b4b':'#2fb36b',function(){doSold(it,{id:it.id,vars:[v.id],sold:to,confirm:true})})}
function restoreAll(){var L=MENU.filter(function(i){return soN(i)>0});if(!L.length){toast('没有售罄的饮品');return}askDo('全部恢复？',L.map(function(i){return esc(i.name)}).join('<br>'),'全部恢复','#2fb36b',function(){api('restore-all',{confirm:true}).then(function(){toast('已全部恢复');loadMenu()})})}
var STK=null;function loadStock(){api('stock').then(drawStock).catch(function(){})}
function drawStock(s){STK=s;$('stk').innerHTML='<tr style="color:#a08070;font-size:13px"><td>材料</td><td>开店</td><td>剩余</td><td>提醒</td></tr>'+s.items.map(function(i,ix){return '<tr class="'+(i.low?'low':'')+'"><td>'+esc(i.name.split(' ')[0])+'</td><td><input type="number" id="st'+ix+'" value="'+i.start+'"></td><td><b>'+i.left+'</b> '+esc(i.unit)+'</td><td><input type="number" id="lw'+ix+'" value="'+i.lowAt+'"></td></tr>'}).join('')}
function stockPost(b){api('stock',b).then(function(s){drawStock(s);loadOv();toast('已保存')})}
function saveStock(){stockPost({items:STK.items.map(function(i,ix){return {k:i.k,name:i.name,unit:i.unit,start:+$('st'+ix).value,low:+$('lw'+ix).value}})})}
function sse(){var es=new EventSource('/events');es.onmessage=function(e){$('conn').style.background='#2fb36b';var s=JSON.parse(e.data);render(s);if(s.event==='screen')loadOv()};es.onerror=function(){$('conn').style.background='#ef4b4b'}}
var booted=0;function boot(){if(booted++)return;sse();loadOv();loadSales();loadMenu();setInterval(loadOv,15000);setInterval(loadSales,60000);setInterval(loadMenu,60000);setInterval(tickCd,1000)}
if(PIN)api('overview').then(function(){$('lock').style.display='none';boot()}).catch(function(){});
</script></body></html>
