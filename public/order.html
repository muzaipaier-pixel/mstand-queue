<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M Stand スマホ注文</title>
<style>
:root{--p:#7b2ff7;--pk:#f72fa8;--y:#ffe14d}
*{box-sizing:border-box}body{margin:0;font-family:"Hiragino Sans","Noto Sans CJK JP",sans-serif;background:#faf6ff;color:#2a1640}
header{background:linear-gradient(120deg,var(--pk),var(--p));color:#fff;padding:18px 16px 14px}
header h1{margin:0;font-size:22px;letter-spacing:1px}header p{margin:4px 0 0;font-size:12px;opacity:.9}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:10px 12px;background:#fff;position:sticky;top:0;z-index:5;box-shadow:0 2px 6px #0001}
.tab{flex:none;padding:7px 14px;border-radius:20px;background:#f1e8ff;font-size:13px;font-weight:600;color:var(--p)}
.tab.on{background:var(--p);color:var(--y)}
.sec h2{font-size:15px;margin:16px 14px 8px;color:var(--p)}
.card{display:flex;gap:12px;background:#fff;margin:0 12px 10px;border-radius:14px;padding:10px;box-shadow:0 1px 4px #7b2ff715}
.card img{width:92px;height:92px;object-fit:cover;border-radius:10px;background:#eee}
.card .t{flex:1;display:flex;flex-direction:column}.card b{font-size:14px}.card small{font-size:11px;color:#7a6890;margin-top:3px;flex:1}
.pr{display:flex;justify-content:space-between;align-items:center}.pr span{font-weight:800;color:var(--pk)}
.add{border:0;width:30px;height:30px;border-radius:50%;background:var(--y);color:var(--p);font-size:20px;font-weight:900}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--p);color:#fff;display:flex;align-items:center;padding:12px 16px;gap:10px}
.bar .n{background:var(--y);color:var(--p);border-radius:12px;padding:2px 9px;font-weight:800}.bar .s{flex:1;font-weight:800;font-size:17px}
.bar button,.go{border:0;background:var(--y);color:var(--p);font-weight:800;border-radius:22px;padding:10px 18px;font-size:15px}
.mask{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;z-index:9}.mask.on{display:flex}
.sheet{background:#fff;width:100%;border-radius:20px 20px 0 0;padding:16px;max-height:88vh;overflow:auto}
.sheet img.h{width:100%;height:190px;object-fit:cover;border-radius:12px}
.opt{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px}.opt div{padding:8px 14px;border-radius:10px;border:2px solid #e5d8fa;font-size:13px}
.opt div.on{border-color:var(--p);background:#f1e8ff;color:var(--p);font-weight:700}
.q{display:flex;align-items:center;gap:14px;margin:6px 0 16px}.q button{width:32px;height:32px;border-radius:50%;border:2px solid var(--p);background:#fff;color:var(--p);font-size:18px}
.go{width:100%;padding:13px}.li{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee;font-size:14px}
input{width:100%;padding:12px;border:2px solid #e5d8fa;border-radius:10px;font-size:16px;margin:6px 0 4px}
.note{font-size:12px;color:#7a6890;margin-bottom:12px}.warn{background:#fff6c7;color:#7a5a00;border-radius:10px;padding:10px;font-size:12px;margin-bottom:12px}
.kc{font-size:10.5px;color:#8a7aa0;margin-top:2px}.lo{display:inline-block;font-size:10px;background:#2e9e5b;color:#fff;border-radius:4px;padding:0 4px;margin-left:4px;vertical-align:1px;font-weight:700}.kcn{font-size:11px;color:#8a7aa0;text-align:center;margin:14px 12px 0}.vk{font-size:10.5px;color:#8a7aa0}
</style><script src="/kcal.js?v=1"></script></head><body>
<header><h1>M Stand 池袋</h1><p>スマホで注文 ・ できあがりは店頭スクリーンでお呼びします</p></header>
<div class="tabs" id="tabs"></div><div id="list" style="padding-bottom:80px"></div>
<div class="bar" id="bar" style="display:none"><span class="n" id="cn">0</span><span class="s" id="cs">¥0</span><button onclick="openCart()">カートを見る</button></div>
<div class="mask" id="m1" onclick="if(event.target==this)close1()"><div class="sheet" id="sh"></div></div>
<script>
var DEV=(function(){try{var d=localStorage.getItem('ms_dev');if(!d){d='d'+Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem('ms_dev',d)}return d}catch(e){return ''}})();
var MAXC=10,MAXY=20000,MSG={rate:'短時間に注文が多すぎます。しばらくしてからお試しください / 下单太频繁，请稍后再试 / Too many orders, please try later',device:'ご注文は3分に1回までです。少しお待ちいただくか、レジでご注文ください / 每台手机3分钟内只能下一单，请稍后再试或到收银台点单 / One order per 3 minutes per phone. Please wait or order at the counter.',cap:'1回のご注文は10杯・¥20,000までです。それ以上はレジでご注文ください / 每单最多10杯、¥20,000，超过请到收银台点单 / Max 10 cups or ¥20,000 per order. Please order at the counter.',busy:'ただいま混み合っています。レジでご注文ください / 现在订单太多，请到收银台点单 / We are busy right now, please order at the counter.',name:'お名前を入力してください（20文字まで）/ 请输入名字（20字以内）/ Please enter your name (max 20)',badname:'そのお名前は使えません / 该名字不可用 / This name cannot be used',soldout:'売り切れの商品・トッピングが含まれています。カートを作り直してください / 购物车里有售罄的饮品或小料，请删除后重新下单 / Some items or toppings are sold out.'};
var M=[],cart=[],cur=null,sel=0,qty=1,ms={},y=function(n){return '¥'+n.toLocaleString()};
function soSig(d){return d.map(function(i){return i.id+(i.so?1:0)+i.vars.map(function(v){return v.so?1:0}).join('')+(i.mods||[]).map(function(L){return L.opts.map(function(o){return o.so?1:0}).join('')}).join('')}).join(',')}
fetch('/api/menu').then(function(r){return r.json()}).then(function(d){M=d;render()});
setInterval(function(){if(document.hidden)return;fetch('/api/menu').then(function(r){return r.json()}).then(function(d){if(!d||!d.length||soSig(d)===soSig(M))return;var y0=window.pageYOffset;M=d;render();window.scrollTo(0,y0);
 if(cur){for(var k=0;k<M.length;k++)if(M[k].id===cur.id){cur=M[k];if(cur.vars[sel]&&cur.vars[sel].so)sel=Math.max(0,cur.vars.findIndex(function(v){return !v.so}));for(var mk in ms)if(soMod(mk))delete ms[mk];if(m1.classList.contains('on')&&sh.getAttribute('data-k')==='item')draw()}}}).catch(function(){})},15000);
function cats(){var c=[];M.forEach(function(i){if(c.indexOf(i.cat)<0)c.push(i.cat)});return c}
function render(){var c=cats();tabs.innerHTML=c.map(function(x,k){return '<div class="tab'+(k?'':' on')+'" onclick="go('+k+')">'+x+'</div>'}).join('');
list.innerHTML=c.map(function(x,k){return '<div class="sec" id="s'+k+'"><h2>'+x+'</h2>'+M.map(function(i,j){if(i.cat!=x)return'';var lo=Math.min.apply(0,i.vars.map(function(v){return v.price}));
return '<div class="card"'+(i.so?' style="opacity:.45;pointer-events:none"':' onclick="pick('+j+')"')+'><img src="'+i.img+'"><div class="t"><b>'+i.name+(kcalLow(kcalOf(i.name))?'<span class="lo">低カロリー</span>':'')+'</b>'+(kcalOf(i.name)?'<div class="kc">'+kcalTxt(kcalOf(i.name))+'</div>':'')+'<small>'+i.desc+'</small><div class="pr"><span>'+y(lo)+(i.vars.length>1?'〜':'')+'</span>'+(i.so?'<b style="color:#c33">売り切れ / 售罄</b>':(i.vars.some(function(v){return v.so})?'<small style="color:#c33;font-weight:700;margin-right:6px">'+i.vars.filter(function(v){return v.so}).map(function(v){return v.name||'通常'}).join('・')+' 售罄</small>':'')+'<button class="add">＋</button>')+'</div></div></div>'}).join('')+'</div>'}).join('')+'<div class="kcn">※'+KCAL_NOTE+'</div>'}
function go(k){[].forEach.call(document.querySelectorAll('.tab'),function(t,i){t.className='tab'+(i==k?' on':'')});document.getElementById('s'+k).scrollIntoView({behavior:'smooth'})}
function soMod(id){var r=false;(cur&&cur.mods||[]).forEach(function(L){L.opts.forEach(function(o){if(o.id===id&&o.so)r=true})});return r}
function modP(){var p=0;(cur.mods||[]).forEach(function(L){L.opts.forEach(function(o){if(ms[o.id])p+=o.price})});return p}
function tg(li,oi){var L=cur.mods[li],o=L.opts[oi];if(o.so)return;if(ms[o.id]){delete ms[o.id]}else{if(L.max===1)L.opts.forEach(function(x){delete ms[x.id]});else if(L.opts.filter(function(x){return ms[x.id]}).length>=L.max)return;ms[o.id]=1}draw()}
function mhtml(){return (cur.mods||[]).map(function(L,li){return '<b>'+L.name+(L.min>0?' <small style="color:#c33">必須</small>':'')+'</b><div class="opt">'+L.opts.map(function(o,oi){return o.so?'<div style="opacity:.4;background:#eee;color:#999;text-decoration:line-through;pointer-events:none">'+o.name+'　售罄</div>':'<div class="'+(ms[o.id]?'on':'')+'" onclick="tg('+li+','+oi+')">'+o.name+(o.price?'　+'+y(o.price):'')+(/トッピング|topping|小料|加料/i.test(L.name)&&kcalTop(o.name)?' <span class="vk">+'+kcalTop(o.name)+'kcal</span>':'')+'</div>'}).join('')+'</div>'}).join('')}
function pick(j){cur=M[j];ms={};sel=Math.max(0,cur.vars.findIndex(function(v){return !v.so}));qty=1;draw();m1.classList.add('on')}
function draw(){var i=cur;sh.setAttribute('data-k','item');sh.innerHTML='<img class="h" src="'+i.img+'"><h3 style="margin:10px 0 2px">'+i.name+'</h3><div class="note">'+i.desc+(kcalOf(i.name)?'<br><span class="vk">'+kcalTxt(kcalOf(i.name))+' ※'+KCAL_NOTE+'</span>':'')+'</div><b>規格を選択</b><div class="opt">'+i.vars.map(function(v,k){return v.so?'<div style="opacity:.4;background:#eee;color:#999;text-decoration:line-through;pointer-events:none">'+(v.name||'通常')+'　売り切れ / 售罄</div>':'<div class="'+(k==sel?'on':'')+'" onclick="sel='+k+';draw()">'+(v.name||'通常')+'　'+y(v.price)+vkc(i,v)+'</div>'}).join('')+'</div>'+mhtml()+'<b>数量</b><div class="q"><button onclick="qty=Math.max(1,qty-1);draw()">−</button><b>'+qty+'</b><button onclick="qty++;draw()">＋</button></div><button class="go" onclick="add()">カートに追加　'+y((i.vars[sel].price+modP())*qty)+'</button>'}
function add(){var v=cur.vars[sel];if(v.so)return;var mids=[],mn=[],bad=false;(cur.mods||[]).forEach(function(L){var c=0;L.opts.forEach(function(o){if(ms[o.id]){if(o.so)bad=true;mids.push(o.id);mn.push(o.name);c++}});if(c<L.min)bad=true});if(bad){alert('オプションを選択してください / 请选择选项（售罄的小料不能选）');return}cart.push({n:cur.name,v:v.name,id:v.id,p:v.price+modP(),q:qty,m:mids,mn:mn});close1();upd()}
function vkc(i,v){var k=kcalOf(i.name);if(!k)return '';var z=String(v.name||'');var c=/(^|[^A-Z])L\b|Ｌ/.test(z)?k.l:(/(^|[^A-Z])M\b|Ｍ/.test(z)||!k.l?k.m:null);return c?' <span class="vk">約'+c+'kcal</span>':''}
function close1(){m1.classList.remove('on')}
function tot(){return cart.reduce(function(a,c){return a+c.p*c.q},0)}
function upd(){bar.style.display=cart.length?'flex':'none';cn.textContent=cart.reduce(function(a,c){return a+c.q},0);cs.textContent=y(tot())}
function openCart(){sh.setAttribute('data-k','cart');sh.innerHTML='<h3 style="margin:0 0 6px">カート</h3>'+cart.map(function(c){return '<div class="li"><span>'+c.n+'<br><small style="color:#7a6890">'+(c.v||'通常')+(c.mn&&c.mn.length?' ＋ '+c.mn.join('・'):'')+' × '+c.q+'</small></span><b>'+y(c.p*c.q)+'</b></div>'}).join('')+'<div class="li"><b>合計（税込）</b><b style="color:#f72fa8">'+y(tot())+'</b></div><p style="margin:14px 0 0"><b>お名前</b></p><input id="nm" placeholder="例：ムラド" maxlength="20"><div class="note">できあがり時、店頭スクリーンでお名前をお呼びします</div><div class="warn">お支払いはレジでお願いします。お名前をお伝えください。</div><div class="warn" id="er" style="display:none;background:#ffe0ea;color:#a0003a"></div><button class="go" id="pay" onclick="pay()">注文する</button>';m1.classList.add('on')}
function pay(){var n=document.getElementById('nm').value.trim(),e=document.getElementById('er');if(!n||n.length>20){e.style.display='block';e.textContent=MSG.name;return}
if(/https?:|www\.|@|\.(com|net|jp)/i.test(n)){e.style.display='block';e.textContent=MSG.badname;return}
var cc=cart.reduce(function(a,c){return a+c.q},0);if(cc>MAXC||tot()>MAXY){e.style.display='block';e.textContent=MSG.cap;return}
var b=document.getElementById('pay');b.disabled=true;b.textContent='送信中…';
fetch('/api/checkout',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n,dev:DEV,items:cart.map(function(c){return{v:c.id,q:c.q,m:c.m||[]}})})}).then(function(r){return r.json()}).then(function(d){if(!d.order_id)throw d.error||0;try{localStorage.setItem('ms_last',d.order_id)}catch(x){}location.href='/order/done?orderId='+encodeURIComponent(d.order_id)}).catch(function(x){b.disabled=false;b.textContent='注文する';if(x==='soldout'){var so={};M.forEach(function(i){i.vars.forEach(function(v){if(v.so)so[v.id]=1});(i.mods||[]).forEach(function(L){L.opts.forEach(function(o){if(o.so)so[o.id]=1})})});cart=cart.filter(function(c){return !so[c.id]&&!(c.m||[]).some(function(id){return so[id]})});upd()}e.style.display='block';e.textContent=MSG[x]||'ただいま注文を受け付けられません。店頭でご注文ください / 请到收银台点单 / Please order at the counter'})}
</script></body></html>
