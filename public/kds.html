<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>M Stand KDS</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,"Hiragino Sans","Noto Sans CJK JP",sans-serif;background:#1c1726;color:#222}
header{display:flex;align-items:center;gap:14px;height:56px;padding:0 16px;background:#2a1f3d;color:#fff;border-bottom:4px solid #c2185b}
header h1{margin:0;font-size:22px}header h1 b{color:#ffe600}
.tabs{display:flex;gap:6px;margin-left:16px}.tab{padding:8px 18px;border-radius:22px;font-size:18px;font-weight:700;background:#3d2f57;color:#ddd;cursor:pointer}
.tab.on{background:#ffe600;color:#2a0640}#clock{margin-left:auto;font-size:24px;font-weight:800}
#grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:10px;align-items:start}
.t{background:#fff;border-radius:10px;overflow:hidden;display:flex;flex-direction:column;min-height:300px}
.hd{padding:8px 10px;color:#fff;cursor:pointer}.hd .r1{display:flex;justify-content:space-between;align-items:baseline}
.nm{font-size:24px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tm{font-size:22px;font-weight:900;font-variant-numeric:tabular-nums;margin-left:6px}
.r2{display:flex;justify-content:space-between;font-size:15px;opacity:.95;margin-top:2px}
.bar{height:6px;background:#eee}.bar i{display:block;height:100%;background:#c2185b}
.src-店头{background:#7a1fa2}.src-手机点单{background:#c2185b}.src-自助{background:#5e35b1}.src-Uber{background:#06804a}
.t.y .hd{background:#f5b800;color:#222}.t.r .hd{background:#e0242f}
.it{display:flex;gap:10px;padding:8px 10px;border-bottom:1px solid #eee}.q{font-size:22px;font-weight:900;min-width:30px;color:#7a1fa2}
.in{font-size:21px;font-weight:800;line-height:1.25}.md{font-size:18px;font-weight:600;color:#c2185b;line-height:1.35}.md.v{color:#555}
.nt{margin:8px 10px;padding:6px 8px;background:#fff6c2;border-left:5px solid #ffe600;font-size:18px}
.sp{flex:1}button{margin:8px;padding:14px;font-size:24px;font-weight:900;border:0;border-radius:8px;background:#ffe600;color:#2a0640}
button.rc{background:#eee;color:#555}
#ptc{display:none;position:fixed;inset:0;background:rgba(10,10,20,.55);z-index:98;align-items:center;justify-content:center}.ptw{background:#fff;color:#111;border-radius:18px;padding:18px;width:min(520px,92vw);box-shadow:0 12px 40px rgba(0,0,0,.35)}.ptt{font-size:20px;font-weight:800;margin-bottom:12px}.pth{font-size:15px;font-weight:600;color:#7a4dff;margin-left:6px}.ptl{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ptb{display:flex;align-items:center;gap:10px;text-align:left;border:2px solid #e3dcff;background:#f7f4ff;border-radius:14px;padding:12px;font-size:17px;color:#111;cursor:pointer}.ptb:active{background:#e3dcff}.ptb b{display:block}.ptb small{display:block;font-size:12px;color:#666;margin-top:2px}.pti{font-size:28px}.ptb i{display:block;font-style:normal;font-weight:800;color:#7a4dff;font-size:15px;margin-top:2px}.ptb.cash{background:#fff8d6;border-color:#ffd24d}.ptb.cash i{color:#7a5a00}.ptb.mine{border-color:#7a4dff;box-shadow:0 0 0 3px #7a4dff55}.ptf{font-size:14px;color:#444;background:#f3f3f7;border-radius:10px;padding:8px 10px;margin-bottom:12px}.pay2{display:flex;gap:6px}.pay2 .chg{flex:0 0 auto;width:auto;background:#555;color:#fff;font-size:15px;padding:8px 10px}.ptx{margin-top:12px;width:100%;padding:12px;border:0;border-radius:12px;background:#eee;font-size:16px}.done .hd{background:#888!important}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#000d;color:#fff;padding:12px 24px;border-radius:10px;font-size:20px;display:none}
@keyframes glow{0%,100%{box-shadow:0 0 0 4px #ffe600,0 0 18px 6px #ffe600aa}50%{box-shadow:0 0 0 4px #fff,0 0 4px 1px #ffe60055}}
@keyframes glow2{0%,100%{box-shadow:0 0 0 6px #ff2d8a,0 0 30px 12px #ff2d8acc;transform:scale(1.015)}50%{box-shadow:0 0 0 6px #fff,0 0 6px 2px #ff2d8a55;transform:scale(1)}}
.t.nw{animation:glow 1.1s ease-in-out infinite;position:relative}.t.nw.ph{animation:glow2 .8s ease-in-out infinite}
.nb{position:absolute;top:-2px;right:-2px;background:#ffe600;color:#2a0640;font-weight:900;font-size:16px;padding:3px 10px;border-radius:0 10px 0 10px;z-index:2}.t.ph .nb{background:#ff2d8a;color:#fff}
#nbar{display:none;position:sticky;top:0;z-index:5;background:#ffe600;color:#2a0640;font-size:26px;font-weight:900;text-align:center;padding:12px;cursor:pointer;animation:bp 1s infinite}#nbar.ph{background:#ff2d8a;color:#fff}
@keyframes bp{50%{opacity:.75}}
#unlock{position:fixed;inset:0;background:#000c;z-index:9;display:flex;align-items:center;justify-content:center;color:#fff;font-size:30px;font-weight:900;text-align:center;line-height:1.6}#unlock div{background:#c2185b;padding:30px 40px;border-radius:20px}
</style></head><body>
<header><h1>M Stand <b>KDS</b></h1><div class="tabs"><span class="tab bt" id="bt" onclick="batch=!batch;render()" style="background:#e8a33d;color:#000">🧋 合并制作</span><span class="tab on" data-v="open">进行中 <span id="nO"></span></span><span class="tab" data-v="done">已完成 <span id="nD"></span></span></div><div id="clock"></div></header>
<div id="nbar" onclick="ack()"></div><div id="unlock" onclick="unlockAudio()"><div>🔔 点一下开启新订单提示音<br>タップして通知音をオン</div></div><div id="grid"></div><div id="toast"></div><div id="ptc" onclick="if(event.target===this)ptClose()"><div class="ptw"><div class="ptt">选择支付方式 <span class="pth"></span></div><div class="ptf"></div><div class="ptl"></div><button class="ptx" onclick="ptClose()">取消</button></div></div><div id="dry" style="display:none;position:fixed;inset:40px;background:#fff;color:#111;z-index:99;border-radius:14px;padding:16px;overflow:auto"><b>预览模式（SQ_TERMINAL_LIVE 未开）：以下是会发给 Square 的订单和 Terminal 结账内容，没有真的发出</b> <button onclick="this.parentNode.style.display='none'">关闭</button><pre style="font-size:13px;white-space:pre-wrap"></pre></div>
<script>
var q=location.search,key=(q.match(/key=([^&]+)/)||[])[1]||'',view='open',data=[],skew=0,busy={};
function now(){return Date.now()+skew}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return'&#'+c.charCodeAt(0)+';'})}
function mmss(ms){var s=Math.max(0,Math.floor(ms/1000)),m=Math.floor(s/60);return m>=60?Math.floor(m/60)+'h'+('0'+m%60).slice(-2):m+':'+('0'+s%60).slice(-2)}
function isDone(o){return o.state==='PREPARED'||o.state==='COMPLETED'}
function toast(t){var e=document.getElementById('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(function(){e.style.display='none'},2500)}
function render(){if(batch)return renderBatch();var t=now(),h='',nO=0,nD=0,list=data.slice();if(view==='done')list.sort(function(a,b){return b.updated_at<a.updated_at?-1:1});
list.forEach(function(o){var d=isDone(o);d?nD++:nO++;if((view==='done')!==d)return;
var ms=t-new Date(o.created_at),m=ms/60000,cl=d?'':m>=10?'r':m>=5?'y':'',d8=new Date(o.created_at),i=data.indexOf(o);
var nw=!d&&fresh[o.id]&&t<fresh[o.id];h+='<div class="t '+cl+(d?' done':'')+(nw?' nw':'')+(o.source==='手机点单'?' ph':'')+'" ontouchstart="seen(\''+esc(o.id)+'\')" onmousedown="seen(\''+esc(o.id)+'\')">'+(nw?'<span class="nb">'+(o.source==='手机点单'?'NEW 手机·未付款':'NEW')+'</span>':'')+'<div class="hd src-'+o.source+'"'+(!d&&!o.readonly?' onclick="act('+i+')"':'')+'><div class="r1"><span class="nm">'+esc(o.name)+'</span><span class="tm">'+mmss(ms)+'</span></div>'+
'<div class="r2"><span>'+esc(o.source)+'</span><span>'+('0'+d8.getHours()).slice(-2)+':'+('0'+d8.getMinutes()).slice(-2)+' 下单</span></div></div>'+
'<div class="bar"><i style="width:'+Math.min(100,m*10)+'%"></i></div>';
o.items.forEach(function(it){h+='<div class="it"><span class="q">'+(it.qty||1)+'</span><div><div class="in">'+esc(it.name)+'</div>'+(it.variation?'<div class="md v">'+esc(it.variation)+'</div>':'')+
it.mods.map(function(x){return'<div class="md">· '+esc(x)+'</div>'}).join('')+(it.note?'<div class="md">📝 '+esc(it.note)+'</div>':'')+'</div></div>'});
h+=(o.note?'<div class="nt">📝 '+esc(o.note)+'</div>':'')+'<div class="sp"></div>'+
(o.readonly?'<button class="rc" disabled>Uber 单 · 仅显示</button>':busy[o.id]?'<button class="rc" disabled>处理中…</button>':d?(o.state==='PREPARED'?'<button class="rc" onclick="act('+i+',1)">召回</button>':'<button class="rc" disabled>已取餐</button>'):'<button onclick="act('+i+')">完成</button>')+(!d&&o.unpaid&&o.source==='手机点单'?termBtn(o,i):'')+(!d&&o.unpaid&&!busy[o.id]?'<button class="rc" style="background:#e0242f;color:#fff;font-size:20px;padding:10px" onclick="cancelO('+i+')">取消（恶作剧单）</button>':'')+'</div>'});
document.getElementById('grid').innerHTML=h||'<p style="color:#aaa;font-size:24px;padding:20px">没有订单</p>';
document.getElementById('nO').textContent=nO;document.getElementById('nD').textContent=nD;
var c=new Date(t);document.getElementById('clock').textContent=('0'+c.getHours()).slice(-2)+':'+('0'+c.getMinutes()).slice(-2);
[].forEach.call(document.querySelectorAll('.tab[data-v]'),function(e){e.className='tab'+(e.getAttribute('data-v')===view?' on':'')})}
var batch=false,term={};
function termBtn(o,i){var t=term[o.id]||{},s=t.status||'';
 if(s==='PENDING'||s==='IN_PROGRESS')return '<button class="rc" style="background:#333;color:#fff" onclick="termCancel('+i+')">⏳ Terminal 等待付款'+(t.pt&&t.pt!=='CARD_PRESENT'?'（'+ptName(t.pt)+'）':'')+'…（点此取消）</button>';
 if(s==='COMPLETED')return '<button class="rc" disabled style="background:#2fb36b;color:#fff">✅ 已在 Terminal 付款</button>';
 var pay=s==='CASH'?'CASH':(o.pay||''),b=baseOf(o),re=(s==='CANCELED'||s==='DRY_RUN'?'（重试）':'');
 if(pay==='CASH')return '<div class="pay2"><button class="rc" style="background:#ffd24d;color:#3a2a00;flex:1" onclick="termPush('+i+')">💴 现金 '+yen(b)+'</button><button class="rc chg" onclick="termPush('+i+')">换方式</button></div>';
 if(pay&&ptName(pay))return '<div class="pay2"><button class="rc" style="background:#7a4dff;color:#fff;flex:1" onclick="termGo('+i+',\''+pay+'\')">'+ptIcon(pay)+' 推到 Terminal · '+ptName(pay)+' '+yen(b+feeOf(b))+re+'</button><button class="rc chg" onclick="termPush('+i+')">换方式</button></div>';
 return '<button class="rc" style="background:#7a4dff;color:#fff" onclick="termPush('+i+')">💳 推到 Terminal 结账'+re+'</button>'}
function feeOf(y){return Math.floor(Number(y||0)*375/10000)}
function baseOf(o){return Number(o.total||0)-Number(o.fee||0)}
function yen(n){return '¥'+Number(n).toLocaleString()}
function ptIcon(k){for(var n=0;n<PTS.length;n++)if(PTS[n][0]===k)return PTS[n][1];return '💳'}
var PTS=[['CASH','💴','现金','不推 Terminal，不加手续费'],['CARD_PRESENT','💳','信用卡 / 借记卡','Visa・JCB・Amex・Apple Pay 等（默认）'],['FELICA_TRANSPORTATION_GROUP','🚃','交通IC','Suica・PASMO・ICOCA 等'],['FELICA_ID','🆔','iD',''],['FELICA_QUICPAY','⚡','QUICPay',''],['QR_CODE','📱','扫码支付','PayPay 等（Terminal 显示二维码）'],['FELICA_ALL','📶','电子钱包（Terminal 上选）','交通IC / iD / QUICPay，可查余额']];
function ptName(k){for(var n=0;n<PTS.length;n++)if(PTS[n][0]===k)return PTS[n][2];return ''}
function termPush(i){var o=data[i];if(!o||busy[o.id])return;var w=document.getElementById('ptc'),b=baseOf(o),f=feeOf(b);
 w.querySelector('.pth').textContent=(o.name||'')+(o.pay&&ptName(o.pay)?' ・ 客人选了「'+ptName(o.pay)+'」':'');
 w.querySelector('.ptf').innerHTML='现金 <b>'+yen(b)+'</b>　｜　非现金 '+yen(b)+' → <b>'+yen(b+f)+'</b>（+3.75% 手续费 '+yen(f)+'）';
 w.querySelector('.ptl').innerHTML=PTS.map(function(p){var c=p[0]==='CASH';return '<button class="ptb'+(c?' cash':'')+(p[0]===o.pay?' mine':'')+'" onclick="termGo('+i+',\''+p[0]+'\')"><span class="pti">'+p[1]+'</span><span><b>'+p[2]+'</b><i>'+(c?yen(b):yen(b)+' → '+yen(b+f))+'</i>'+(p[3]?'<small>'+p[3]+'</small>':'')+'</span></button>'}).join('');
 w.style.display='flex'}
function ptClose(){document.getElementById('ptc').style.display='none'}
function termGo(i,pt){ptClose();var o=data[i];if(!o||busy[o.id])return;busy[o.id]=1;render();
 api('POST','/api/kds/terminal',{id:o.id,pt:pt},function(s,j){delete busy[o.id];if(s===200){term[o.id]=j;if(pt==='CASH'){o.pay='CASH';o.fee=0;o.total=j.amount;toast('💴 收现金 '+yen(j.amount)+(j.dry?'（预览，未改 Square 订单）':'（已去掉手续费）'))}else if(j.dry)showDry(j);else{o.pay=pt;toast('已推到 Terminal（'+ptName(pt)+'）：'+o.name);termPoll(o.id)}}else{toast('失败：'+(j.error||s));if(j.status)term[o.id]=j}render()})}
function termPoll(id){var n=0;(function p(){api('GET','/api/kds/terminal-status?id='+encodeURIComponent(id),null,function(s,j){if(s===200)term[id]=j;render();
 if(j.status==='COMPLETED'){toast('付款完成 ✅');load();return}if(/CANCEL/.test(j.status||'')){toast('Terminal 已取消，可重试');return}if(++n<120)setTimeout(p,3000)})})()}
function termCancel(i){var o=data[i];api('POST','/api/kds/terminal-cancel',{id:o.id},function(s,j){if(s===200)term[o.id]=j;else toast('取消失败'+(/FELICA/.test((term[o.id]||{}).pt||'')?'：电子钱包请在 Terminal 上手动取消':'：'+(j.error||s)));render()})}
function showDry(j){var w=document.getElementById('dry');w.style.display='block';w.querySelector('pre').textContent=JSON.stringify({fee:j.feeChange,order:j.order,checkout:j.body},null,1)}
function mkind(m){return /甘さ|甜|糖|%/.test(m)?'s':/氷|冰|ice/i.test(m)?'i':'t'}
function renderBatch(){var g={},n=0;data.forEach(function(o){if(isDone(o))return;n++;o.items.forEach(function(it){var k=it.name+(it.variation?'｜'+it.variation:''),e=g[k]||(g[k]={name:it.name,v:it.variation,q:0,s:{},i:{},t:{}}),q=+it.qty||1;e.q+=q;
 var f={s:0,i:0};it.mods.forEach(function(m){var c=mkind(m);e[c][m]=(e[c][m]||0)+q;f[c]=1});if(!f.s)e.s['标准甜度']=(e.s['标准甜度']||0)+q;if(!f.i)e.i['正常冰']=(e.i['正常冰']||0)+q})});
 var L=Object.keys(g).sort(function(a,b){return g[b].q-g[a].q}),fm=function(o){return Object.keys(o).sort(function(a,b){return o[b]-o[a]}).map(function(k){return esc(k)+' <b>'+o[k]+'</b>'}).join(' / ')};
 var h='<div style="color:#ccc;font-size:18px;padding:6px 4px;width:100%;flex-basis:100%;grid-column:1/-1">合并制作 · 未完成 '+n+' 单（点「🧋 合并制作」切回单张）</div>';
 L.forEach(function(k){var e=g[k];h+='<div class="t" style="min-width:300px"><div class="hd" style="background:#e8a33d;color:#111"><div class="r1"><span class="nm">'+esc(e.name)+' ×'+e.q+'</span></div><div class="r2"><span>'+esc(e.v||'')+'</span></div></div>'+
 '<div class="it"><div><div class="md" style="font-size:20px">🍬 '+fm(e.s)+'</div><div class="md" style="font-size:20px">🧊 '+fm(e.i)+'</div>'+(Object.keys(e.t).length?'<div class="md" style="font-size:20px">➕ '+fm(e.t)+'</div>':'')+'</div></div></div>'});
 document.getElementById('grid').innerHTML=h;document.getElementById('nO').textContent=n}
function api(m,p,b,cb){var x=new XMLHttpRequest();x.open(m,p);x.setRequestHeader('X-KDS-Key',decodeURIComponent(key));x.setRequestHeader('Content-Type','application/json');
x.onload=function(){var j={};try{j=JSON.parse(x.responseText)}catch(e){}cb(x.status,j)};x.onerror=function(){cb(0,{})};x.send(b?JSON.stringify(b):null)}
function act(i,rc){var o=data[i];if(!o||busy[o.id])return;busy[o.id]=1;render();
api('POST','/api/kds/'+(rc?'recall':'done'),{id:o.id},function(s,j){delete busy[o.id];if(s===200&&j.order){data[i]=j.order;toast(j.warn?j.warn:rc?'已召回：'+o.name:'已完成，正在叫号：'+o.name)}else toast('失败：'+(j.error||s));render();load()})}
function cancelO(i){var o=data[i];if(!o||busy[o.id])return;if(!confirm('确定取消这张未付款手机单？\n'+o.name))return;busy[o.id]=1;render();
api('POST','/api/kds/cancel',{id:o.id},function(s,j){delete busy[o.id];if(s===200){data.splice(i,1);toast(j.warn||('已取消：'+o.name))}else toast('失败：'+(j.error||s));render();load()})}
function load(){api('GET','/api/kds',null,function(s,j){if(s===403){document.getElementById('grid').innerHTML='<p style="color:#fff;font-size:24px;padding:20px">网址里的 key 不对，请用正确的 KDS 链接打开。</p>';return}
if(s===200){skew=j.now-Date.now();data=j.orders||[];detectNew();render()}})}
[].forEach.call(document.querySelectorAll('.tab[data-v]'),function(e){e.onclick=function(){view=e.getAttribute('data-v');render()}});

var fresh={},known=null,ac=null,rep=0,repT=null,titleT=null;
function unlockAudio(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume();var b=ac.createBuffer(1,1,22050),n=ac.createBufferSource();n.buffer=b;n.connect(ac.destination);n.start(0)}catch(e){}
try{localStorage.kdsSnd='1'}catch(e){}document.getElementById('unlock').style.display='none'}
document.addEventListener('touchend',function(){if(ac&&ac.state!=='running')ac.resume()},true);
function bell(phone){if(!ac)return;var t0=ac.currentTime+.02,notes=phone?[1318.5,1568,2093,1568,2093]:[1046.5,1318.5,1568,2093];
notes.forEach(function(f,i){var t=t0+i*.14;[1,2.01].forEach(function(h,k){var o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=f*h;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(k?.06:.28,t+.008);g.gain.exponentialRampToValueAtTime(.0005,t+(k?.4:1.1));o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+1.2)})})}
function pending(){var t=now(),n=0,ph=0;data.forEach(function(o){if(!isDone(o)&&fresh[o.id]&&t<fresh[o.id]){n++;if(o.source==='手机点单')ph++}});return{n:n,ph:ph}}
function banner(){var p=pending(),b=document.getElementById('nbar');if(!p.n){b.style.display='none';stopAlert();return}
b.className=p.ph?'ph':'';b.textContent='🔔 新订单 / 新しい注文 ×'+p.n+(p.ph?'（手机点单 '+p.ph+' · 未付款）':'')+'　点此确认';b.style.display='block'}
function alertNew(phone){rep=0;clearInterval(repT);bell(phone);try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}
repT=setInterval(function(){if(++rep>=3||!pending().n){clearInterval(repT);return}bell(pending().ph>0)},10000);
clearInterval(titleT);var f=0;titleT=setInterval(function(){document.title=(f=!f)?'🔔 新订单 ×'+pending().n:'M Stand KDS';if(!pending().n){clearInterval(titleT);document.title='M Stand KDS'}},1000)}
function stopAlert(){clearInterval(repT);clearInterval(titleT);document.title='M Stand KDS'}
function ack(){fresh={};stopAlert();banner();render()}
function seen(id){if(fresh[id]){delete fresh[id];if(!pending().n)stopAlert();banner();setTimeout(render,0)}}
function detectNew(){var ids={},nw=[];data.forEach(function(o){ids[o.id]=1;if(known&&!known[o.id]&&!isDone(o))nw.push(o)});
if(known&&nw.length){var t=now();nw.forEach(function(o){fresh[o.id]=t+30000});alertNew(nw.some(function(o){return o.source==='手机点单'}))}
known=ids;banner()}
try{if(localStorage.kdsSnd)document.getElementById('unlock').querySelector('div').innerHTML+='<br><small style="font-size:18px">（iPad 每次打开都需要点一下）</small>'}catch(e){}
setInterval(banner,1000);
load();setInterval(load,3000);setInterval(render,1000);
</script></body></html>
