<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Square 工具（预览）</title>
<style>body{font-family:-apple-system,"Hiragino Sans","Noto Sans CJK SC",sans-serif;background:#f5f2ec;margin:0;padding:16px;color:#222}h1{font-size:20px}.tabs button{border:0;padding:10px 14px;margin:0 6px 6px 0;border-radius:20px;background:#fff;font-size:15px}.tabs .on{background:#222;color:#fff}.card{background:#fff;border-radius:14px;padding:14px;margin:10px 0;box-shadow:0 1px 3px #0001}.big{font-size:28px;font-weight:700}.row{display:flex;gap:10px;flex-wrap:wrap}.row .card{flex:1;min-width:150px}table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px;border-bottom:1px solid #eee;text-align:left}.bar{height:10px;background:#e8a33d;border-radius:5px}.btn{background:#222;color:#fff;border:0;border-radius:12px;padding:14px 18px;font-size:17px}.warn{background:#fff4d6;padding:8px 10px;border-radius:8px;font-size:13px}.hours{display:flex;align-items:flex-end;height:80px;gap:2px}.hours div{flex:1;background:#7aa6d8}.k .hours div{background:#e8a33d}input{font-size:17px;padding:10px;border-radius:10px;border:1px solid #ccc;width:140px}pre{white-space:pre-wrap;font-size:12px;background:#f7f7f7;padding:8px}</style>
<h1>Square 工具 <small style="color:#999">预览版</small></h1>
<div class="tabs"><button data-t="term">① 推单到 Terminal</button><button data-t="ch">② Kiosk vs 收银台</button><button data-t="rec">③ 加购推荐</button><button data-t="so">④ 一键售罄</button><button data-t="lap">⑤ 久未到店会员</button></div><div id="v"></div>
<script>
const PIN=localStorage.pin||prompt('PIN');localStorage.pin=PIN;const H={'x-pin':PIN,'content-type':'application/json'};
const api=(p,b)=>fetch('/api/sq/'+p,b?{method:'POST',headers:H,body:JSON.stringify(b)}:{headers:H}).then(r=>r.json());
const v=document.getElementById('v'),y=n=>'¥'+Math.round(n).toLocaleString();
const T={
async term(){const d=await api('devices');v.innerHTML=`<div class=card><div>Terminal：<b>${d.map(x=>x.name+'（'+(x.status=='AVAILABLE'?'在线':'离线')+'）').join('、')}</b></div><p>金额 <input id=a type=number value=650> 円 &nbsp;备注 <input id=n value="电话单 #12"></p><button class=btn id=go>推到 Terminal 收款</button><p class=warn>预览模式：不会真的发到机器、不会扣款。</p><pre id=o></pre></div>`;
 go.onclick=async()=>{o.textContent=JSON.stringify(await api('terminal-checkout',{amount:a.value,note:n.value}),null,1)}},
async ch(){const d=await api('channels?days=30');const K=d.channels.sort((a,b)=>b.n-a.n);
 v.innerHTML=`<div class=row>${K.map(c=>`<div class=card><div>${c.channel}</div><div class=big>${c.share}%</div><div>${c.n} 单 · 客单价 ${y(c.avg)}</div><div>高峰 ${c.peak}:00</div></div>`).join('')}</div>`+K.filter(c=>c.channel!='其他').slice(0,2).map(c=>{const m=Math.max(...c.hours)||1;return `<div class="card ${c.channel=='Kiosk'?'k':''}"><b>${c.channel} 各时段单数</b><div class=hours>${[...c.hours.slice(12),...c.hours.slice(0,4)].map((h,i)=>`<div title="${(i+12)%24}时 ${h}" style="height:${h/m*100}%"></div>`).join('')}</div><small>12时 → 凌晨3时</small></div>`}).join('')+`<p style="color:#888">近 ${d.days} 天 · 共 ${d.total} 单 · 数据来自 Square 订单来源</p>`},
async rec(){const d=await api('recs');v.innerHTML=`<div class=card><b>建议在 Kiosk 推荐的加料</b><table><tr><th>饮品</th><th>最常加</th><th>加料率</th></tr>${d.addon.map(x=>`<tr><td>${x.item}</td><td>${x.addon}</td><td>${x.rate}%</td></tr>`).join('')}</table></div><div class=card><b>经常一起点的</b><table>${d.pairs.map(x=>`<tr><td>${x.pair}</td><td>${x.n} 次</td></tr>`).join('')}</table></div><div class=card><b>最受欢迎加料</b><table>${d.topMods.map(x=>`<tr><td>${x.mod}</td><td>${x.n}</td></tr>`).join('')}</table></div><p style="color:#888">近 60 天 ${d.orders} 单。只是建议，Kiosk 设置需要你在 Square 后台改。</p>`},
async so(){v.innerHTML=`<div class=card><b>一键售罄（Square 收银台 + Kiosk + Uber）</b><p>商品规格 ID <input id=vid style="width:260px" placeholder="ITEM_VARIATION id"></p><button class=btn id=s1>设为售罄</button> <button class=btn id=s0 style="background:#4a8">恢复供应</button><p class=warn>预览模式：只显示会改什么，不会真的改 Square 或 Uber。</p><pre id=o></pre></div>`;
 const f=async b=>{o.textContent=JSON.stringify(await api('soldout',{variationId:vid.value,soldOut:b}),null,1)};s1.onclick=()=>f(true);s0.onclick=()=>f(false)},
async lap(){const d=await api('lapsed?days=30');v.innerHTML=`<div class=card><b>来过 2 次以上、30 天以上没来的会员</b>（共 ${d.list.length} 位 / 会员 ${d.members} 位）<table><tr><th>名字</th><th>来店</th><th>累计</th><th>上次</th></tr>${d.list.map(c=>`<tr><td>${c.name}</td><td>${c.visits} 次</td><td>${y(c.spend)}</td><td>${c.daysAgo} 天前</td></tr>`).join('')}</table><p class=warn>只是名单，不会联系客人。</p></div>`}};
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');v.innerHTML='加载中…';T[b.dataset.t]().catch(e=>v.textContent='出错：'+e)});
document.querySelector(`[data-t="${location.hash.slice(1)||'ch'}"]`).click();
</script></html>
