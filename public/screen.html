<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache">
<title>M Stand Screen</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background-color:#8A00E6;background-image:-webkit-linear-gradient(-45deg,#FF1F9E,#B000E8,#4B00B5);background-image:linear-gradient(135deg,#FF1F9E,#B000E8,#4B00B5);font-family:"Hiragino Sans","Noto Sans CJK JP","Noto Sans JP","Droid Sans Fallback",sans-serif;color:#fff}
#menu{position:absolute;left:0;top:0;width:84%;height:100%;display:block;border:0}
#q{position:absolute;right:0;top:0;width:16%;height:100%;background-color:#5A00C0;background-image:-webkit-linear-gradient(top,#8A00E6,#3A0096);background-image:linear-gradient(to bottom,#8A00E6,#3A0096);text-align:center}
.t{position:absolute;left:0;width:100%;top:3%;font-size:1.5vw;font-weight:bold;line-height:1.3}
.t span{display:block;font-size:1vw}
#nw{position:absolute;left:4%;width:92%;top:12%;height:18%}
#glow{position:absolute;left:0;top:0;width:100%;height:100%;border-radius:1vw;background-color:rgba(255,230,0,.30);opacity:0;-webkit-transform:scale(1);transform:scale(1)}
#n{position:absolute;left:0;top:0;width:100%;height:100%;overflow:hidden;display:-webkit-box;display:-webkit-flex;display:flex;-webkit-box-align:center;-webkit-align-items:center;align-items:center;-webkit-box-pack:center;-webkit-justify-content:center;justify-content:center}
#nt{display:block;width:100%;font-weight:bold;line-height:1.1;color:#FFE600;text-shadow:0 0 1.2vw rgba(255,230,0,.55)}
.call #nt{-webkit-animation:pop .7s ease-out 1,fl .5s .7s 6;animation:pop .7s ease-out 1,fl .5s .7s 6}
.call #glow{-webkit-animation:gl 1s ease-in-out 4;animation:gl 1s ease-in-out 4}
@-webkit-keyframes pop{0%{-webkit-transform:scale(.2);opacity:0}60%{-webkit-transform:scale(1.18);opacity:1}80%{-webkit-transform:scale(.95)}100%{-webkit-transform:scale(1)}}
@keyframes pop{0%{transform:scale(.2);opacity:0}60%{transform:scale(1.18);opacity:1}80%{transform:scale(.95)}100%{transform:scale(1)}}
@-webkit-keyframes fl{50%{opacity:.35}}@keyframes fl{50%{opacity:.35}}
@-webkit-keyframes gl{0%{opacity:0;-webkit-transform:scale(.9)}50%{opacity:1;-webkit-transform:scale(1.04)}100%{opacity:0;-webkit-transform:scale(.9)}}
@keyframes gl{0%{opacity:0;transform:scale(.9)}50%{opacity:1;transform:scale(1.04)}100%{opacity:0;transform:scale(.9)}}
.sub{position:absolute;left:0;width:100%;top:31%;font-size:.95vw;font-weight:bold}
.box{position:absolute;left:4%;width:92%;background-color:rgba(255,255,255,.14);border-radius:.8vw;padding:1% 0}
.box h2{margin:0 0 .5vh 0;font-size:.95vw}
#prepb{top:52%;height:22%;overflow:hidden}
#histb{top:76%;height:14%;overflow:hidden}
#prep,#hist{word-wrap:break-word;overflow-wrap:break-word;line-height:1.15}
#prep span,#hist span{display:inline-block;max-width:96%;margin:0 .4vw;font-weight:bold;word-wrap:break-word;overflow-wrap:break-word}
.brand{position:absolute;left:0;width:100%;bottom:2%;font-size:.9vw;font-weight:bold}
#off{position:absolute;right:.5vw;top:.5vh;width:.8vw;height:.8vw;border-radius:50%;background:#f33;display:none}
</style></head><body>
<img id="menu" src="/menu.jpg?v=6" alt="menu">
<div id="q">
 <div class="t">お呼び出し番号<span>请取餐</span></div>
 <div id="nw"><div id="glow"></div><div id="n"><span id="nt">-</span></div></div>
 <div class="sub">お待たせしました</div>
 <div class="box" id="prepb"><h2>制作中 / Preparing</h2><div id="prep"></div></div>
 <div class="box" id="histb"><h2>最近の番号 / 最近叫号</h2><div id="hist"></div></div>
 <div class="brand">M Stand 池袋</div>
</div>
<div id="off"></div><div id="dbg" style="display:none;position:absolute;left:0;bottom:0;background:#000;color:#fff;font-size:14px;padding:2px 6px"></div>
<audio id="chime" src="/chime_marimba.mp3" preload="auto"></audio><audio id="vo" preload="none"></audio>
<script>
(function(){
try{
var SOUND=location.search.indexOf('sound=0')<0;
var lastSeq=null,ctx=null,fails=0;
function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function fit(){try{var m=$('menu'),W=Math.floor(window.innerWidth*0.84),H=window.innerHeight,a=1612/1080,w=W,h=Math.round(W/a);
 if(h>H){h=H;w=Math.round(H*a)}
 m.style.width=w+'px';m.style.height=h+'px';m.style.left=Math.floor((W-w)/2)+'px';m.style.top=Math.floor((H-h)/2)+'px';
 var dpr=window.devicePixelRatio||1,want=(w*dpr>1700)?'/menu@2x.jpg?v=6':'/menu.jpg?v=6';
 if(m.getAttribute('src')!==want)m.setAttribute('src',want);
 if(location.search.indexOf('debug=1')>=0){var d=$('dbg');d.style.display='block';d.innerHTML=window.innerWidth+'x'+window.innerHeight+' dpr '+dpr+' img '+w+'x'+h+' '+want}
}catch(e){}}
fit();if(window.addEventListener)window.addEventListener('resize',fit,false);
function chime(){if(!SOUND)return;try{var a=$('chime');a.currentTime=0;var p=a.play();if(p&&p['catch'])p['catch'](function(){})}catch(e){}}
function hasJa(){try{if(!window.speechSynthesis||!window.SpeechSynthesisUtterance)return null;var vs=speechSynthesis.getVoices()||[];for(var i=0;i<vs.length;i++){if(vs[i].lang&&vs[i].lang.indexOf('ja')===0)return vs[i]}}catch(e){}return null}
var LANGS=(function(){var m=/[?&]lang=([^&]*)/.exec(location.search);return m?decodeURIComponent(m[1]):'ja,zh,en'})();
function localSpeak(num){var v=hasJa();if(!v)return;try{var u=new SpeechSynthesisUtterance((/^[0-9]+$/.test(String(num))?num+'番':num+'様')+'、お待たせしました');u.lang='ja-JP';u.rate=0.9;u.voice=v;speechSynthesis.speak(u)}catch(e){}}
function speak(num){if(!SOUND)return;
 setTimeout(function(){
  try{var a=$('vo');a.onerror=function(){a.onerror=null;localSpeak(num)};a.src='/voice?n='+encodeURIComponent(String(num))+'&lang='+encodeURIComponent(LANGS);a.volume=1;if(a.load)a.load();var p=a.play();if(p&&p['catch'])p['catch'](function(){})}catch(e){localSpeak(num)}
 },1800)}
function unlock(){var ids=['chime','vo'];for(var k=0;k<ids.length;k++){try{var a=$(ids[k]);if(ids[k]==='vo'&&!a.src)a.src='/voice_fallback.mp3';a.volume=0;var p=a.play();if(p&&p['catch'])p['catch'](function(){});(function(b){setTimeout(function(){b.pause();b.volume=1},80)})(a)}catch(e){}}}
if(document.addEventListener){document.addEventListener('click',unlock,false);document.addEventListener('touchstart',unlock,false)}
var lastCallAt=null;
// shrink font (px) until content fits box (ES5, works on old WebView)
function fitText(t,box,max,min,wrap,txt){var BW=box.clientWidth,BH=box.clientHeight;
 function w1(str,f){t.style.whiteSpace='nowrap';t.style.width='auto';t.style.display='inline-block';t.innerHTML=str;t.style.fontSize=f+'px';return t.offsetWidth}
 var full=esc(txt),f=Math.floor(max);while(f>min&&w1(full,f)>BW){f-=2}
 var ok=f;t.style.display='block';t.style.width='100%';
 while(ok>min&&t.offsetHeight>BH){ok-=2;t.style.fontSize=ok+'px'}
 if(wrap&&ok<max*0.45){var parts=String(txt).split(/[\s\u30fb\uff65\u00b7]+/),lw='';for(var i=0;i<parts.length;i++)if(parts[i].length>lw.length)lw=parts[i];
  var g=Math.floor(max*0.6);while(g>min&&w1(esc(lw),g)>BW){g-=2}
  t.style.display='block';t.style.width='100%';t.style.whiteSpace='normal';t.innerHTML=full.replace(/([\u30fb\uff65\u00b7])/g,'$1<wbr>');t.style.fontSize=g+'px';
  while(g>min&&t.offsetHeight>BH){g-=2;t.style.fontSize=g+'px'}
  if(g>ok)return g}
 t.style.display='block';t.style.width='100%';t.style.whiteSpace='nowrap';t.innerHTML=full;t.style.fontSize=ok+'px';return ok}
function fitList(el,box,max,min){var f=Math.floor(max);el.style.fontSize=f+'px';var h2=box.getElementsByTagName('h2')[0],avail=box.clientHeight-(h2?h2.offsetHeight:0)-4;
 while(f>min&&(el.offsetHeight>avail||el.scrollWidth>el.clientWidth+1)){f-=1;el.style.fontSize=f+'px'}}
function fitAll(){try{var W=window.innerWidth;fitText($('nt'),$('n'),W*0.08,10,true,curTxt);fitList($('prep'),$('prepb'),W*0.016,8);fitList($('hist'),$('histb'),W*0.022,8)}catch(e){}}
if(window.addEventListener)window.addEventListener('resize',fitAll,false);
var lastTxt=null,curTxt='-';
function handle(s){
 // new call = callAt changed
 var isCall=lastCallAt!==null&&s.callAt&&s.callAt!==lastCallAt&&s.current;
 var nw=$('nw'),cur=String(s.current||'-');
 curTxt=cur;
 var p=s.preparing||[],h='';for(var i=0;i<p.length&&i<12;i++)h+='<span>'+esc(p[i].num)+'</span>';$('prep').innerHTML=h||'—';
 var hs=s.history||[];h='';for(var j=1;j<hs.length&&j<7;j++)h+='<span>'+esc(hs[j])+'</span>';$('hist').innerHTML=h;
 var txt=cur+'|'+$('prep').innerHTML+'|'+h;if(txt!==lastTxt){lastTxt=txt;fitAll()}
 if(isCall){nw.className='';void nw.offsetWidth;setTimeout(function(){nw.className='call'},20);
  if(nw._t)clearTimeout(nw._t);nw._t=setTimeout(function(){nw.className=''},5000);chime();speak(s.current)}
 lastCallAt=s.callAt||0;
}
function poll(){
 try{var x=new XMLHttpRequest();x.open('GET','/api/state?t='+(new Date().getTime()),true);
 x.onreadystatechange=function(){if(x.readyState!==4)return;
  if(x.status===200){try{handle(JSON.parse(x.responseText));fails=0;$('off').style.display='none'}catch(e){}}
  else{fails++;if(fails>2)$('off').style.display='block'}
  setTimeout(poll,1500)};
 x.send(null)}catch(e){setTimeout(poll,5000)}
}
poll();
setTimeout(function(){location.reload()},30*60*1000);
}catch(e){}
})();
</script>
</body></html>
