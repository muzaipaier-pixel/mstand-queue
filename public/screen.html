<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>M Stand Screen</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;font-family:-apple-system,"Hiragino Sans","Noto Sans CJK JP","PingFang SC",sans-serif;background:linear-gradient(135deg,#ff9a3d,#ff5c8a)}
.wrap{display:flex;height:100vh;width:100vw}
.menu{flex:0 0 84%;height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#ff9a3d,#ff5c8a)}
.menu img{width:100%;height:100%;object-fit:fill;display:block}.menu img.fit{object-fit:contain}
.q{flex:1;background:linear-gradient(170deg,#ff7a3d,#ff4f86);color:#fff;display:flex;flex-direction:column;align-items:center;padding:3vh .6vw;box-sizing:border-box;box-shadow:-.4vw 0 1vw #0002}
.t{font-size:1.5vw;font-weight:800;text-align:center;line-height:1.2}.t small{display:block;font-size:1vw;opacity:.9}
.n{font-size:8vw;font-weight:900;line-height:1;margin:2vh 0 1vh;text-shadow:0 .4vw 1vw #0003}
.n.flash{animation:f .6s 5}@keyframes f{50%{opacity:.25;transform:scale(1.06)}}
.sub{font-size:.95vw;font-weight:700;text-align:center}
.hist{margin-top:auto;width:100%;background:#fff3;border-radius:.8vw;padding:1.2vh .4vw;box-sizing:border-box;text-align:center}
.hist h2{margin:0 0 .8vh;font-size:.95vw}.hist .l{display:flex;flex-wrap:wrap;justify-content:center;gap:.3vw .9vw}
.hist .l div{font-size:2.2vw;font-weight:800;opacity:.9}
.hist .l.p div{font-size:1.6vw;opacity:.85}.brand{font-size:.9vw;font-weight:800;margin-top:1.2vh;opacity:.9}
.off{position:fixed;right:.5vw;top:.5vh;width:.8vw;height:.8vw;border-radius:50%;background:#f33;display:none}
</style></head><body>
<div class="wrap"><div class="menu"><img id="mimg" src="/menu.jpg?v=4" alt="menu"></div>
<div class="q"><div class="t">お呼び出し番号<small>请取餐</small></div>
<div class="n" id="n">-</div><div class="sub">お待たせしました</div>
<div class="hist" style="margin-top:auto"><h2>制作中 / Preparing</h2><div class="l p" id="prep"></div></div><div class="hist" style="margin-top:1.2vh"><h2>最近の番号 / 最近叫号</h2><div class="l" id="hist"></div></div>
<div class="brand">M Stand 池袋</div></div></div><div class="off" id="off"></div>
<script>
let lastSeq=null,es;
// fit menu: stretch slightly if close to aspect, otherwise contain (whole menu always visible)
function fit(){const m=mimg.parentElement,r=m.clientWidth/m.clientHeight,a=1613/1080;mimg.classList.toggle('fit',r/a<0.82||r/a>1.08)}
addEventListener('resize',fit);fit();
// sound
const SOUND=new URLSearchParams(location.search).get('sound')!=='0';let ctx=null;
function initAudio(){if(!SOUND)return;try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume()}catch(e){}}
function tone(f,t,d){const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=f;o.connect(g);g.connect(ctx.destination);g.gain.setValueAtTime(0,ctx.currentTime+t);g.gain.linearRampToValueAtTime(.4,ctx.currentTime+t+.02);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+t+d);o.start(ctx.currentTime+t);o.stop(ctx.currentTime+t+d)}
function chime(){if(!SOUND)return;initAudio();if(!ctx)return;try{tone(880,0,1.2);tone(659,.45,1.5)}catch(e){}}
function speak(num){if(!SOUND||!window.speechSynthesis)return;try{const u=new SpeechSynthesisUtterance((/^[0-9]+$/.test(String(num))?num+'番のお客様':num+'様')+'、お待たせしました');u.lang='ja-JP';u.rate=.9;const v=speechSynthesis.getVoices().find(v=>v.lang.startsWith('ja'));if(v)u.voice=v;setTimeout(()=>speechSynthesis.speak(u),1200)}catch(e){}}
initAudio();
['click','touchstart','keydown'].forEach(ev=>addEventListener(ev,()=>{initAudio();try{if(window.speechSynthesis&&!window._su){window._su=1;const w=new SpeechSynthesisUtterance('');speechSynthesis.speak(w)}}catch(e){}},{passive:true}));

function render(s){{const L=String(s.current||'-').length;n.style.fontSize=L>5?'2.6vw':L>3?'4.2vw':L>2?'5.4vw':'8vw'}prep.innerHTML=(s.preparing||[]).slice(0,12).map(x=>`<div>${x.num}</div>`).join('')||'<div style="font-size:1vw">—</div>';n.textContent=s.current||'-';hist.innerHTML=(s.history||[]).slice(1,7).map(x=>`<div>${x}</div>`).join('');
 if(lastSeq!==null&&s.seq!==lastSeq&&s.current&&s.event!=='reset'&&s.event!=='prep'){n.classList.remove('flash');void n.offsetWidth;n.classList.add('flash');chime();speak(s.current)}lastSeq=s.seq}
function connect(){if(es)es.close();es=new EventSource('/events');es.onopen=()=>off.style.display='none';
 es.onmessage=e=>render(JSON.parse(e.data));es.onerror=()=>{off.style.display='block';es.close();setTimeout(connect,5000)}}
connect();
setInterval(()=>fetch('/api/state').then(r=>r.json()).then(render).catch(()=>{}),60000);
setTimeout(()=>location.reload(),30*60*1000);
</script></body></html>
