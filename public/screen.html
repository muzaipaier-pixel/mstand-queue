<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>M Stand Screen</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;font-family:-apple-system,"Hiragino Sans","Noto Sans CJK JP","PingFang SC",sans-serif;background:#fff6ee}
.wrap{display:flex;height:100vh;width:100vw}
.menu{flex:0 0 65%;display:flex;align-items:center;justify-content:center;background:#fff6ee}
.menu img{width:100%;height:100%;object-fit:contain}
.q{flex:1;background:linear-gradient(160deg,#ff8a3d,#ff5c8a);color:#fff;display:flex;flex-direction:column;align-items:center;padding:3vh 1.5vw;box-sizing:border-box}
.t{font-size:2.6vw;font-weight:800;text-align:center;line-height:1.25}.t small{display:block;font-size:1.6vw;opacity:.9}
.n{font-size:15vw;font-weight:900;line-height:1;margin:2vh 0;text-shadow:0 .5vw 1.5vw #0003}
.n.flash{animation:f .6s 5}@keyframes f{50%{opacity:.25;transform:scale(1.06)}}
.sub{font-size:1.5vw;font-weight:700;opacity:.95;text-align:center}
.hist{margin-top:auto;width:100%;background:#fff3;border-radius:1.2vw;padding:2vh 1vw;box-sizing:border-box;text-align:center}
.hist h2{margin:0 0 1vh;font-size:1.5vw}.hist .l{display:flex;flex-wrap:wrap;justify-content:center;gap:.6vw 1.6vw}
.hist .l div{font-size:3.6vw;font-weight:800;opacity:.9}
.brand{font-size:1.3vw;font-weight:800;margin-top:1.5vh;opacity:.9}
.off{position:fixed;right:1vw;top:1vh;width:1vw;height:1vw;border-radius:50%;background:#f33;display:none}
</style></head><body>
<div class="wrap"><div class="menu"><img src="/menu.jpg" alt="menu"></div>
<div class="q"><div class="t">お呼び出し番号<small>请取餐 · Now Serving</small></div>
<div class="n" id="n">-</div><div class="sub">番のお客様、お待たせしました</div>
<div class="hist"><h2>最近の番号 / 最近叫号</h2><div class="l" id="hist"></div></div>
<div class="brand">M Stand 池袋</div></div></div><div class="off" id="off"></div>
<script>
let lastSeq=null,es;
function render(s){n.textContent=s.current||'-';hist.innerHTML=(s.history||[]).slice(1,7).map(x=>`<div>${x}</div>`).join('');
 if(lastSeq!==null&&s.seq!==lastSeq&&s.current&&s.event!=='reset'){n.classList.remove('flash');void n.offsetWidth;n.classList.add('flash')}lastSeq=s.seq}
function connect(){if(es)es.close();es=new EventSource('/events');es.onopen=()=>off.style.display='none';
 es.onmessage=e=>render(JSON.parse(e.data));es.onerror=()=>{off.style.display='block';es.close();setTimeout(connect,5000)}}
connect();
setInterval(()=>fetch('/api/state').then(r=>r.json()).then(render).catch(()=>{}),60000);
setTimeout(()=>location.reload(),30*60*1000);
</script></body></html>
