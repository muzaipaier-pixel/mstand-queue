<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ご注文ありがとうございます</title>
<style>body{margin:0;font-family:"Hiragino Sans","Noto Sans CJK JP",sans-serif;background:#faf6ff;color:#2a1640;text-align:center}
header{background:linear-gradient(120deg,#f72fa8,#7b2ff7);color:#fff;padding:28px 16px}h1{margin:0;font-size:22px}
.box{background:#fff;margin:-18px 16px 16px;border-radius:18px;padding:22px 16px;box-shadow:0 2px 10px #7b2ff722}
.nm{display:inline-block;background:#7b2ff7;color:#ffe14d;font-size:34px;font-weight:900;padding:10px 26px;border-radius:14px;margin:10px 0}
.li{display:flex;justify-content:space-between;text-align:left;border-bottom:1px solid #eee;padding:9px 0;font-size:14px}
.st{font-weight:800;color:#f72fa8;margin-top:14px}a{display:inline-block;margin:10px;color:#7b2ff7;font-weight:700}</style></head><body>
<header><h1>ご注文を受け付けました</h1></header>
<div class="box"><div class="pay" style="background:#ffe14d;color:#5a1fb8;font-weight:900;border-radius:12px;padding:12px;font-size:17px;margin-bottom:14px">レジでお名前をお伝えのうえ、<br>お支払いください</div><div>注文番号 <b id="no" style="font-size:20px;color:#7b2ff7">—</b></div><div style="margin-top:8px">お呼び出し名</div><div class="nm" id="nm">…</div>
<p style="font-size:14px">できあがりましたら、店頭スクリーンで<br>お名前をお呼びします。</p>
<div id="li"></div><div class="st" id="st"></div></div><a href="/order">メニューに戻る</a>
<script>
var p=new URLSearchParams(location.search),id=p.get('orderId')||p.get('order_id');try{id=id||localStorage.getItem('ms_last')}catch(e){}
var S={PROPOSED:'受付済み',RESERVED:'準備中',PREPARED:'できあがりました！',COMPLETED:'お受け取り済み',CANCELED:'キャンセル'};
function load(){if(!id){document.getElementById('nm').textContent='—';return}
fetch('/api/order-status?id='+encodeURIComponent(id)).then(function(r){return r.json()}).then(function(d){
document.getElementById('nm').textContent=(d.name||'')+' 様';document.getElementById('no').textContent=d.no||'—';
document.getElementById('li').innerHTML=(d.items||[]).map(function(i){return '<div class="li"><span>'+i.n+' '+(i.v||'')+'</span><b>×'+i.q+'</b></div>'}).join('')+(d.fee?'<div class="li"><span>キャッシュレス決済手数料（3.75%）</span><b>¥'+d.fee.toLocaleString()+'</b></div>':'')+'<div class="li"><b>合計'+(d.pay?'（'+d.pay+'）':'')+'</b><b>¥'+(d.total||0).toLocaleString()+'</b></div>';
document.getElementById('st').textContent=d.state==='CANCELED'?'この注文はキャンセルされました':(d.paid?'お支払い済み・':'')+'状態：'+(S[d.state]||'受付済み')})}
load();setInterval(load,15000);
</script><div id="ocf" style="position:fixed;left:0;top:0;width:100%;height:100%;overflow:hidden;pointer-events:none;z-index:99"></div>
<style>#ocf i{position:absolute;top:-4%;display:block;width:8px;height:14px;border-radius:2px;-webkit-animation:ocf 2.6s ease-in 1 forwards;animation:ocf 2.6s ease-in 1 forwards}
#ocf i.r{width:5px;height:22px;border-radius:3px}
@-webkit-keyframes ocf{0%{-webkit-transform:translate3d(0,0,0) rotate(0);opacity:1}100%{-webkit-transform:translate3d(-20px,105vh,0) rotate(600deg);opacity:.2}}
@keyframes ocf{0%{transform:translate3d(0,0,0) rotate(0);opacity:1}100%{transform:translate3d(-20px,105vh,0) rotate(600deg);opacity:.2}}</style>
<script>(function(){try{var m=/[?&]orderId=([^&]+)/.exec(location.search),id=m?m[1]:'',k='ms_cf_'+id,demo=/[?&]burst=1/.test(location.search);
if(!demo){if(!id)return;try{if(sessionStorage.getItem(k))return;sessionStorage.setItem(k,'1')}catch(e){}}
var c=document.getElementById('ocf'),h='',C=['#FFE14D','#F72FA8','#00D2B8','#FF7A00','#7C4DFF','#5AE65A'];
for(var i=0;i<40;i++){var l=(Math.random()*100).toFixed(1),dl=(Math.random()*.7).toFixed(2);h+='<i class="'+(i%3?'':'r')+'" style="left:'+l+'%;background-color:'+C[i%C.length]+';-webkit-animation-delay:'+dl+'s;animation-delay:'+dl+'s"></i>'}
c.innerHTML=h;setTimeout(function(){c.innerHTML='';c.style.display='none'},3500)}catch(e){}})();</script>
</body></html>
