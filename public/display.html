<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>M Stand お呼び出し</title><link rel="manifest" href="/manifest.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="apple-touch-icon" href="/icon-180.png">
<style>
html,body{margin:0;height:100%;font-family:-apple-system,"Hiragino Sans","PingFang SC",sans-serif;background:linear-gradient(135deg,#ff8a3d,#ff5c8a);color:#fff;overflow:hidden}
.wrap{display:flex;height:100%}.main{flex:3;display:flex;flex-direction:column;justify-content:center;align-items:center}
.t{font-size:5vw;font-weight:800;text-align:center;line-height:1.2}.t small{display:block;font-size:3vw;opacity:.9}
.n{font-size:32vw;font-weight:900;line-height:1;text-shadow:0 1vw 3vw #0003}.n.flash{animation:f 0.6s 4}@keyframes f{50%{opacity:.2;transform:scale(1.05)}}
.side{flex:1;background:#fff3;padding:3vw 2vw;text-align:center}.side h2{font-size:2.2vw;margin:0 0 2vw}.side div{font-size:6vw;font-weight:800;opacity:.85}
.brand{position:fixed;left:2vw;bottom:1.5vw;font-size:2vw;font-weight:800}
#start{position:fixed;inset:0;background:#000c;display:flex;justify-content:center;align-items:center;font-size:4vw;font-weight:800;text-align:center;cursor:pointer}
#opt{position:fixed;right:1vw;bottom:1vw;font-size:1.6vw;opacity:.8}
</style></head><body>
<div class="wrap"><div class="main"><div class="t">お呼び出し番号<small>请取餐</small></div><div class="n" id="n">-</div><div class="t" style="font-size:3vw">お待たせしました</div></div>
<div class="side"><h2>最近の番号<br>最近叫号</h2><div id="hist"></div><h2 style="margin-top:2vw">制作中<br>Preparing</h2><div id="prep" style="font-size:3.2vw;opacity:.8;display:flex;flex-wrap:wrap;justify-content:center;gap:0 1.5vw"></div></div></div>
<div class="brand">M Stand 池袋</div>
<label id="opt"><input type="checkbox" id="voice" checked> 音声読み上げ / 语音</label>
<div id="start" onclick="unlock()">👆 タップして開始<br><small>点击开始（启用声音）</small></div>
<script>
let ctx,lastSeq=null;voice.checked=localStorage.voice!=='0';voice.onchange=()=>localStorage.voice=voice.checked?'1':'0';
function unlock(){ctx=new (window.AudioContext||window.webkitAudioContext)();start.remove();chime();try{speechSynthesis.cancel();const w=new SpeechSynthesisUtterance('音声をオンにしました');w.lang='ja-JP';speechSynthesis.speak(w)}catch(e){}try{document.documentElement.requestFullscreen()}catch(e){}}
function tone(f,t,d){const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=f;o.connect(g);g.connect(ctx.destination);g.gain.setValueAtTime(0,ctx.currentTime+t);g.gain.linearRampToValueAtTime(.4,ctx.currentTime+t+.02);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+t+d);o.start(ctx.currentTime+t);o.stop(ctx.currentTime+t+d)}
function chime(){if(!ctx)return;tone(880,0,1.2);tone(659,.45,1.5)}
function speak(num){if(!voice.checked||!window.speechSynthesis)return;const u=new SpeechSynthesisUtterance((/^[0-9]+$/.test(String(num))?num+'番のお客さま':num+'さま')+'、お待たせしました');u.lang='ja-JP';u.rate=.9;const v=speechSynthesis.getVoices().find(v=>v.lang.startsWith('ja'));if(v)u.voice=v;speechSynthesis.speak(u)}
function render(s){{const L=String(s.current||s.current===0?s.current:'-').length;n.style.fontSize=L>12?'5vw':L>8?'6.5vw':L>5?'10vw':L>3?'16vw':''}prep.innerHTML=(s.preparing||[]).map(x=>`<span>${x.num}</span>`).join('');n.textContent=s.current||s.current===0?s.current:'-';hist.innerHTML=s.history.slice(1,6).map(x=>`<div>${x}</div>`).join('');
 if(lastSeq!==null&&s.seq!==lastSeq&&(s.current||s.current===0)&&s.event!=='reset'&&s.event!=='prep'){n.classList.remove('flash');void n.offsetWidth;n.classList.add('flash');chime();speak(s.current)}lastSeq=s.seq}
const es=new EventSource('/events');es.onmessage=e=>render(JSON.parse(e.data));
try{navigator.wakeLock&&navigator.wakeLock.request('screen')}catch(e){}
</script></body></html>
