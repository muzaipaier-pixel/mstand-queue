query SalesOverTime($widgetTabbedInput: WidgetTabbedInput!) {
  salesOverTime(widgetTabbedInput: $widgetTabbedInput) {
    ...widgetTabbedSubWidgetFields
    __typename
  }
}

fragment widgetTabbedSubWidgetFields on WidgetTabbed {
  tabs {
    ...widgetTabbedTabFields
    __typename
  }
  subWidgets {
    header {
      ...headerFields
      __typename
    }
    insights {
      ...insightFields
      __typename
    }
    moreDetails {
      ...moreDetailsFields
      __typename
    }
    visualization {
      ...visualizationFields
      __typename
    }
    dateRangeAdjusted
    aggregationMeta {
      start
      end
      timeUnit
      __typename
    }
    __typename
  }
  dateRangeAdjusted
  lastUpdatedTimestamp
  __typename
}

fragment widgetTabbedTabFields on WidgetTabbedTab {
  cursor
  label
  hasCSV
  __typename
}

fragment headerFields on WidgetHeader {
  primaryHeader
  subtitle
  tooltipMarkdown
  __typename
}

fragment insightFields on Insight {
  header
  body
  secondaryCTA {
    label
    href
    __typename
  }
  tertiaryCTA {
    label
    href
    __typename
  }
  __typename
}

fragment moreDetailsFields on CTAButton {
  label
  href
  __typename
}

fragment visualizationFields on Visualization {
  __typename
  ... on BigNumbers {
    ...visualizationBigNumbersFields
    __typename
  }
  ... on ConversionFunnel {
    ...visualizationConversionFunnelFields
    __typename
  }
  ... on HeatMap {
    ...visualizationHeatMapFields
    __typename
  }
  ... on PeriodComparisonSeries {
    ...visualizationPeriodComparisonSeriesFields
    __typename
  }
  ... on AreaSeries {
    ...visualizationAreaSeriesFields
    __typename
  }
  ... on BarSeries {
    ...visualizationBarSeriesFields
    __typename
  }
  ... on BarSeriesWithoutDateTime {
    ...visualizationBarSeriesWithoutDateTimeFields
    __typename
  }
}

fragment visualizationBigNumbersFields on BigNumbers {
  bigNumbers {
    label
    value
    __typename
  }
  __typename
}

